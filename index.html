<div id="banner" class="hidden"></div>
<div id="screen" class="center"><div class="card" style="text-align:center"><span class="logo">Budgetr</span><p class="muted"><span class="spin"></span> Loading…</p></div></div>

<script>
"use strict";
const VERSION = "3.3.0";
const DEMO = new URLSearchParams(location.search).has("demo");
const DEFAULT_PATH = "Budgetr/budgetr_data.json";

/* =====================================================================
   Money logic - the SAME rules as the desktop budgetr.py, on the SAME file
   ===================================================================== */
const DEFAULTS = { name_a: "Henry", name_b: "Badet", salary_a: 0, salary_b: 0, split_mode: "salary", split_a: 50, currency: "₱",
  cats_out: ["Rent", "Food & Groceries", "Bills & Utilities", "Transport", "Shopping", "Health", "Debt", "Savings", "Fun", "Other"],
  cats_in: ["Salary", "Bonus", "Side income", "Other"],
  allocs: [
    { id: "rent", bank: "Security Bank", holder: "A", purpose: "Rent", category: "Rent", mode: "split", monthly: 15500, a: 0, b: 0 },
    { id: "util", bank: "Gcash", holder: "A", purpose: "Utilities (Electricity, Water, Internet)", category: "Bills & Utilities", mode: "split", monthly: 4000, a: 0, b: 0 },
    { id: "save", bank: "Maya Savings", holder: "B", purpose: "Savings", category: "Savings", mode: "fixed", monthly: 0, a: 5858, b: 4058 },
    { id: "groc", bank: "Maya Wallet", holder: "B", purpose: "Groceries", category: "Food & Groceries", mode: "split", monthly: 10000, a: 0, b: 0 }] };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const CAT_COLORS = ["#ff6b8a","#ffd23f","#00d4ff","#3ddc97","#8b5cf6","#ff7a45","#ff4fd8","#5eead4","#a3e635","#f472b6"];
const num = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
const nowStamp = () => { const d = new Date(); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
function normalize(d) {
  if (!d || typeof d !== "object" || !Array.isArray(d.entries)) throw new Error("This is not a Budgetr data file.");
  d.settings = { ...DEFAULTS, ...(d.settings || {}) }; d.rev = d.rev || 0; return d;
}
function shareA(s) {
  if (s.split_mode === "half") return 0.5;
  if (s.split_mode === "custom") return Math.min(100, Math.max(0, num(s.split_a))) / 100;
  const a = num(s.salary_a), b = num(s.salary_b); return a + b > 0 ? a / (a + b) : 0.5;
}
function period(view, y, m) {             // m: 1-12, like the desktop
  const s = iso(new Date(y, m - 1, 1)), mid = iso(new Date(y, m - 1, 16)), e = iso(new Date(y, m, 1));
  return view === "1" ? [s, mid] : view === "2" ? [mid, e] : [s, e];
}
function allocMonthly(s, al) {
  if (al.mode === "fixed") return [num(al.a), num(al.b)];
  const m = num(al.monthly), sa = shareA(s); return [m * sa, m * (1 - sa)];
}
const allocById = (s, id) => (s.allocs || []).find(a => a.id === id);
function bankStatus(d, lo, hi) {
  const s = d.settings, days = (new Date(hi) - new Date(lo)) / 864e5, f = days > 20 ? 1 : 0.5;
  return (s.allocs || []).map(al => {
    const [ma, mb] = allocMonthly(s, al);
    const st = { al, target_a: ma * f, target_b: mb * f, in_a: 0, in_b: 0, paid: 0, balance: 0, extra: 0 };
    for (const e of d.entries) {
      const a = num(e.amount), inP = lo <= e.edate && e.edate < hi;
      if (e.kind === "alloc" && e.alloc === al.id) { st.balance += a; if (inP) st["in_" + e.who.toLowerCase()] += a; }
      else if (e.kind === "in" && e.bank === al.id) { st.balance += a; if (inP) st.extra += a; }
      else if (e.kind === "out" && e.bank === al.id) { st.balance -= a; if (inP) st.paid += a; }
    }
    st.target = st.target_a + st.target_b; st.put_in = st.in_a + st.in_b; return st;
  });
}
function summary(d, lo, hi) {
  const s = d.settings, sa = shareA(s), rows = d.entries.filter(e => lo <= e.edate && e.edate < hi);
  const P = { A: { in: 0, own: 0, paid: 0, set_aside: 0 }, B: { in: 0, own: 0, paid: 0, set_aside: 0 } };
  let tin = 0, tout = 0, shared = 0; const byCat = {};
  for (const e of rows) {
    const a = num(e.amount);
    if (e.kind === "in") { tin += a; if (e.who === "S") { P.A.in += a * sa; P.B.in += a * (1 - sa); } else P[e.who].in += a; continue; }
    if (e.kind === "alloc") { P[e.who].set_aside += a; continue; }
    tout += a;
    if (e.who === "P") { P.A.paid += a * sa; P.B.paid += a * (1 - sa); } else P[e.who].paid += a;
    byCat[e.category] = (byCat[e.category] || 0) + a;
    if ((e.split || "shared") === "shared") shared += a; else P[e.split].own += a;
  }
  P.A.share = shared * sa; P.B.share = shared * (1 - sa);
  for (const w of ["A", "B"]) {
    P[w].out = P[w].own + P[w].share; P[w].left = P[w].in - P[w].out;
    const direct = rows.filter(e => e.kind === "out" && e.who === w).reduce((t, e) => t + num(e.amount), 0);
    let banked = 0;
    for (const e of rows) if (e.kind === "in" && e.bank) { const a = num(e.amount); banked += e.who === w ? a : e.who === "S" ? a * (w === "A" ? sa : 1 - sa) : 0; }
    P[w].pocket = P[w].in - P[w].set_aside - direct - banked;
  }
  const owed = Math.round((P.A.paid - P.A.out) * 100) / 100;
  return { rows, tin, tout, left: tin - tout, shared, sa, P, byCat, owed };
}
function money(s, v, dec = 0) { v = num(v); return (v < 0 ? "-" : "") + (s.currency || "₱") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function parseAmount(t) { t = String(t ?? "").replace(/[,₱\s]/g, ""); if (!/^\d*\.?\d+$/.test(t)) throw 0; const v = +t; if (!(v > 0)) throw 0; return Math.round(v * 100) / 100; }
const validISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "") && iso(new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10))) === s;
const nameOf = (s, w) => w === "A" ? s.name_a : w === "B" ? s.name_b : w === "S" ? "both of us" : "";

/* =====================================================================
   Microsoft sign-in (standard OAuth with PKCE - no library, no password stored)
   ===================================================================== */
const AUTH = "https://login.microsoftonline.com/common/oauth2/v2.0";
const SCOPES = "openid profile offline_access User.Read Files.ReadWrite";
const REDIRECT = location.origin + location.pathname;
const LS = { get: k => { try { return JSON.parse(localStorage.getItem("budgetr_" + k)); } catch (e) { return null; } },
             set: (k, v) => { try { localStorage.setItem("budgetr_" + k, JSON.stringify(v)); } catch (e) { } },
             del: k => { try { localStorage.removeItem("budgetr_" + k); } catch (e) { } } };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function signIn(silent = false) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const st = uid(); sessionStorage.setItem("budgetr_pkce", JSON.stringify({ verifier, st, silent }));
  const q = new URLSearchParams({ client_id: window.BUDGETR_CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, scope: SCOPES,
    code_challenge: challenge, code_challenge_method: "S256", state: st, response_mode: "query" });
  if (silent) q.set("prompt", "none");
  location.assign(`${AUTH}/authorize?${q}`);
}
async function tokenRequest(body) {
  const r = await fetch(`${AUTH}/token`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: window.BUDGETR_CLIENT_ID, scope: SCOPES, ...body }) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.error || "Sign-in failed");
  LS.set("tok", { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in - 120) * 1000 });
}
async function finishRedirect() {
  const p = new URLSearchParams(location.search); if (!p.has("code") && !p.has("error")) return null;
  const saved = JSON.parse(sessionStorage.getItem("budgetr_pkce") || "{}"); sessionStorage.removeItem("budgetr_pkce");
  history.replaceState(null, "", REDIRECT);
  if (p.get("state") !== saved.st) return "Sign-in was interrupted. Please try again.";
  if (p.has("error")) return saved.silent ? "silent-failed" : (p.get("error_description") || p.get("error"));
  await tokenRequest({ grant_type: "authorization_code", code: p.get("code"), redirect_uri: REDIRECT, code_verifier: saved.verifier });
  return "ok";
}
async function accessToken() {
  const t = LS.get("tok"); if (!t) throw Object.assign(new Error("Not signed in"), { needLogin: true });
  if (Date.now() < t.exp) return t.access;
  try { await tokenRequest({ grant_type: "refresh_token", refresh_token: t.refresh }); return LS.get("tok").access; }
  catch (e) { throw Object.assign(new Error("Session expired"), { needLogin: true }); }
}

/* =====================================================================
   OneDrive file access. Every change = read the newest file -> apply only
   this change -> save ONLY IF nobody saved in between (If-Match); else retry.
   ===================================================================== */
const GRAPH = "https://graph.microsoft.com/v1.0/me/drive/root:/";
const filePath = () => (LS.get("path") || DEFAULT_PATH).replace(/^\/+/, "");
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
class Conflict extends Error {}
const Drive = DEMO ? {
  /* demo: a pretend OneDrive inside this browser, with the same "changed since you read it" rule */
  async read() { const f = LS.get("demo_file"); if (!f) { const e = new Error("not found"); e.status = 404; throw e; } return { data: JSON.parse(f.text), etag: f.etag }; },
  async write(data, etag) { const f = LS.get("demo_file"); if (etag && f && f.etag !== etag) throw new Conflict(); const n = "e" + uid().slice(0, 8);
    LS.set("demo_file", { text: JSON.stringify(data), etag: n }); return n; },
} : {
  async gfetch(url, opt = {}) {
    const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: "Bearer " + await accessToken() } });
    if (r.status === 401) { LS.del("tok"); throw Object.assign(new Error("Session expired"), { needLogin: true }); }
    return r;
  },
  async read() {
    const r = await this.gfetch(GRAPH + encPath(filePath()));
    if (!r.ok) { const e = new Error(r.status === 404 ? "not found" : "OneDrive said " + r.status); e.status = r.status; throw e; }
    const meta = await r.json();
    const c = await fetch(meta["@microsoft.graph.downloadUrl"], { cache: "no-store" });
    if (!c.ok) throw new Error("Couldn't download the file (" + c.status + ")");
    return { data: JSON.parse(await c.text()), etag: meta.eTag };
  },
  async write(data, etag) {
    const r = await this.gfetch(GRAPH + encPath(filePath()) + ":/content", { method: "PUT",
      headers: { "Content-Type": "application/json", ...(etag ? { "If-Match": etag } : { "If-None-Match": "*" }) }, body: JSON.stringify(data, null, 1) });
    if (r.status === 412 || r.status === 409) throw new Conflict();
    if (!r.ok) throw new Error("OneDrive said " + r.status);
    return (await r.json()).eTag;
  },
};
let D = null, ETAG = null;
async function load() { const r = await Drive.read(); D = normalize(r.data); ETAG = r.etag; LS.set("cache", D); }
async function apply(fn) {
  for (let i = 0; i < 4; i++) {
    const r = await Drive.read(); const d = normalize(r.data);
    fn(d);
    d.rev = (d.rev || 0) + 1; d.saved_by = "Phone"; d.saved_at = nowStamp();
    try { ETAG = await Drive.write(d, r.etag); D = d; LS.set("cache", D); return; }
    catch (e) { if (!(e instanceof Conflict)) throw e; await new Promise(res => setTimeout(res, 400 + i * 400)); }  // someone saved a moment ago: redo on top of theirs
  }
  throw new Error("The file kept changing - try again in a moment.");
}

/* =====================================================================
   Screen
   ===================================================================== */
const $ = (q, el = document) => el.querySelector(q);
const st = { y: new Date().getFullYear(), m: new Date().getMonth() + 1, view: "all", filter: "all", undo: null, offline: false };
let toastT;
function toast(msg, c = "var(--gold)") { const t = $("#toast"); t.textContent = msg; t.style.background = c; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
function banner(msg, c = "var(--out)") { const b = $("#banner"); b.textContent = msg || ""; b.style.background = c; b.classList.toggle("hidden", !msg); }
async function change(fn, ok, color) {
  if (st.offline || !navigator.onLine) { toast("You're offline - nothing was saved", "var(--out)"); return false; }
  try { await apply(fn); render(); if (ok) toast(ok, color); return true; }
  catch (e) { console.error(e); if (e.needLogin) { loginScreen("Please sign in again to save."); return false; }
    toast("Couldn't save: " + (e.message || e), "var(--out)"); return false; }
}

function render() {
  const d = D, s = d.settings, [lo, hi] = period(st.view, st.y, st.m), S = summary(d, lo, hi);
  const na = s.name_a, nb = s.name_b, last = new Date(st.y, st.m, 0).getDate(), pa = Math.round(S.sa * 100);
  const mode = s.split_mode === "half" ? "50 / 50" : s.split_mode === "custom" ? `${pa}% / ${100 - pa}% (custom)` : `${pa}% / ${100 - pa}% (by salary)`;
  let settle;

let modalOpen = false, pendingRender = false;
function modal(html, wire) {
  const m = $("#modal"); m.innerHTML = `<div class="box">${html}</div>`; m.classList.remove("hidden"); modalOpen = true;
  const close = () => { m.classList.add("hidden"); m.innerHTML = ""; modalOpen = false; if (pendingRender) { pendingRender = false; render(); } };
  m.onclick = ev => { if (ev.target === m || ev.target.closest("[data-close]")) close(); };
  const box = $(".box", m); wire(box, close); return close;
}
const pick = (name, items, cur) => `<div class="pick" data-pick="${name}">${items.map(([v, t, c]) => `<button type="button" data-v="${esc(v)}" class="${v === cur ? "on" : ""}" ${c ? `style="--c:${c}"` : ""}>${esc(t)}</button>`).join("")}</div>`;
function wirePicks(box) {
  box.querySelectorAll("[data-pick]").forEach(p => p.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    p.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); p.dispatchEvent(new Event("change"));
  }));
}
const picked = (box, name) => $(`[data-pick="${name}"] button.on`, box)?.dataset.v ?? "";
function setPick(box, name, v) { const p = $(`[data-pick="${name}"]`, box); if (!p) return; p.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === v)); p.dispatchEvent(new Event("change")); }
async function busyBtn(btn, fn) { btn.setAttribute("disabled", ""); const t = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>`; try { return await fn(); } finally { btn.removeAttribute("disabled"); btn.innerHTML = t; } }

      const ok = await change(dd => {

function payday() {
  const s = D.settings, t = new Date(), [lo, hi] = period(t.getDate() <= 15 ? "1" : "2", t.getFullYear(), t.getMonth() + 1), E = D.entries;
  const salDone = w => E.some(x => x.kind === "in" && x.who === w && x.note === "Payday" && lo <= x.edate && x.edate < hi);
  const alDone = (w, id) => E.some(x => x.kind === "alloc" && x.who === w && x.alloc === id && lo <= x.edate && x.edate < hi);
  const plan = [];
  const blocks = ["A", "B"].map(w => {
    const c = w === "A" ? "var(--a)" : "var(--b)", sal = Math.round(num(s["salary_" + w.toLowerCase()]) / 2 * 100) / 100;
    if (sal <= 0) return `<div class="al"><b style="color:${c}">${esc(nameOf(s, w))}</b> <span class="muted small">no salary set</span></div>`;
    let given = 0;
    const rows = (s.allocs || []).map(al => { const amt = Math.round(allocMonthly(s, al)[w === "A" ? 0 : 1] / 2 * 100) / 100; if (amt <= 0) return "";
      given += amt; const done = alDone(w, al.id); if (!done) plan.push([w, al.id, amt]);
      return `<div class="spread small" style="margin-top:4px"><span class="${done ? "muted" : ""}">→ 🏦 ${esc(al.bank)} <span class="muted">(${esc(al.purpose)})</span></span><b class="${done ? "in" : ""}">${done ? "done ✔" : money(s, amt, 2)}</b></div>`; }).join("");
    return `<div class="al"><div class="spread"><b style="color:${c}" class="mid">${esc(nameOf(s, w))}</b>${salDone(w) ? `<span class="in small" style="font-weight:800">salary added ✔</span>`
      : `<input class="amt" data-pay="${w}" inputmode="decimal" value="${sal}" style="max-width:150px;font-size:20px;padding:8px">`}</div>${rows}
      <div class="small ${sal - given >= 0 ? "in" : "out"}" style="font-weight:800;margin-top:8px">Free money left after the banks: ${money(s, sal - given, 2)}</div></div>`;
  }).join("");
  modal(`<h2 class="gold">💰 Payday • ${MONTHS[t.getMonth()].slice(0, 3)} ${+lo.slice(8)}-${new Date(new Date(hi) - 864e5).getDate()}</h2>
    <p class="muted small">Adds this cutoff's salary (half the monthly salary), then puts each person's share into each bank.</p>${blocks}
    <div class="mf"><button class="btn b-line" data-close>Cancel</button><button class="btn b-gold" data-save>Add & fill banks</button></div>`,
  (box, close) => {
    $("[data-save]", box).onclick = ev => busyBtn(ev.currentTarget, async () => {
      const adds = [];
      for (const inp of box.querySelectorAll("[data-pay]")) { try { adds.push([inp.dataset.pay, parseAmount(inp.value)]); } catch (x) { inp.classList.add("err"); return; } }
      if (!adds.length && !plan.length) { close(); return toast(num(s.salary_a) + num(s.salary_b) > 0 ? "Already done for this cutoff ✔" : "Set your salaries in Settings first", "var(--warn)"); }
      const today = iso(new Date()), now = nowStamp();
      const ok = await change(dd => {
        for (const [w, a] of adds) if (!dd.entries.some(x => x.kind === "in" && x.who === w && x.note === "Payday" && lo <= x.edate && x.edate < hi))
          dd.entries.push({ id: uid(), created: now, by: "Phone", edate: today, kind: "in", amount: a, category: "Salary", who: w, split: "shared", note: "Payday" });
        for (const [w, id, a] of plan) if (!dd.entries.some(x => x.kind === "alloc" && x.who === w && x.alloc === id && lo <= x.edate && x.edate < hi))
          dd.entries.push({ id: uid(), created: now, by: "Phone", edate: today, kind: "alloc", amount: a, category: "Bank", who: w, alloc: id, split: "shared", note: "Payday" });
      }, `💰 Payday done • ${adds.length} salar${adds.length !== 1 ? "ies" : "y"}, ${plan.length} bank deposit${plan.length !== 1 ? "s" : ""}`);
      if (ok) close();
    });
  });
}

        <div class="grid g2" style="margin-top:8px"><div><span class="lab">Counts as</span><select data-f="category">${s.cats_out.map(c => `<option ${c === r.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
          <div><span class="lab">How</span><select data-f="mode"><option value="split" ${r.mode !== "fixed" ? "selected" : ""}>Shared (our split)</option><option value="fixed" ${r.mode === "fixed" ? "selected" : ""}>Fixed amounts</option></select></div></div>
        ${r.mode === "fixed" ? `<div class="grid g2" style="margin-top:8px"><div><span class="lab">${esc(s.name_a)} / month</span><input data-f="a" inputmode="decimal" value="${num(r.a) || ""}"></div><div><span class="lab">${esc(s.name_b)} / month</span><input data-f="b" inputmode="decimal" value="${num(r.b) || ""}"></div></div>`
          : `<div style="margin-top:8px"><span class="lab">Total / month</span><input data-f="monthly" inputmode="decimal" value="${num(r.monthly) || ""}"></div>`}
        <div class="small gold" style="font-weight:800;margin-top:8px">Each puts in: ${esc(s.name_a)} ${money(s, a)} • ${esc(s.name_b)} ${money(s, b)} / month</div></div>`; }).join("");
    const over = ta > num(s.salary_a) + 0.5 || tb > num(s.salary_b) + 0.5;
    $("#al_tot", box).innerHTML = `<span class="${over ? "out" : ""}">Per month: ${esc(s.name_a)} ${money(s, ta)} of ${money(s, s.salary_a)} (free ${money(s, num(s.salary_a) - ta)}) • ${esc(s.name_b)} ${money(s, tb)} of ${money(s, s.salary_b)} (free ${money(s, num(s.salary_b) - tb)})</span>`;
  };
  modal(`<h2 class="gold">🏦 Bank allocations</h2><p class="muted small">Per month. "Shared" follows your split in Settings; "Fixed" means each person puts in their own amount. Payday puts in half of each, every cutoff.</p>
    <div id="al_rows"></div><p><button class="link" id="al_add">＋ add a bank</button></p><p class="small" id="al_tot" style="font-weight:800"></p>
    <div class="mf"><button class="btn b-line" data-close>Cancel</button><button class="btn b-gold" data-save>Save</button></div>`,
  (box, close) => {
    draw(box);
    box.addEventListener("input", ev => { const card = ev.target.closest("[data-i]"); if (!card || !ev.target.dataset.f) return; rows[+card.dataset.i][ev.target.dataset.f] = ev.target.value; });
    box.addEventListener("change", ev => { if (ev.target.dataset.f === "mode") { rows[+ev.target.closest("[data-i]").dataset.i].mode = ev.target.value; draw(box); } else if (ev.target.dataset.f) draw(box); });
    box.addEventListener("click", ev => { const k = ev.target.closest("[data-kill]"); if (k) { rows.splice(+k.dataset.kill, 1); draw(box); }
      if (ev.target.id === "al_add") { rows.push({ id: uid().slice(0, 8), bank: "", holder: "A", purpose: "", category: "Other", mode: "split", monthly: 0, a: 0, b: 0 }); draw(box); } });
    $("[data-save]", box).onclick = ev => busyBtn(ev.currentTarget, async () => {
      const n = v => { const t = String(v ?? "").replace(/[,₱\s]/g, ""); if (t === "") return 0; if (!/^\d*\.?\d+$/.test(t)) throw 0; return +t; };
      let out; try { out = rows.map(r => { if (!String(r.bank).trim()) throw "name";
        return { id: r.id, bank: r.bank.trim(), holder: r.holder, purpose: String(r.purpose || "").trim() || r.bank.trim(), category: r.category, mode: r.mode === "fixed" ? "fixed" : "split", monthly: n(r.monthly), a: n(r.a), b: n(r.b) }; }); }
      catch (x) { return toast(x === "name" ? "Every bank needs a name" : "Amounts must be numbers", "var(--out)"); }
      if (await change(dd => { dd.settings.allocs = out; }, "✔ Bank allocations saved", "var(--in)")) close();
    });
  });
}
function settingsDialog() {
  const s = D.settings;
  modal(`<h2>⚙️ Settings</h2><div class="form">
    <div class="grid g2"><div><label>Partner 1</label><input id="s_na" value="${esc(s.name_a)}"></div><div><label>Monthly salary</label><input id="s_sa" inputmode="decimal" value="${num(s.salary_a) || ""}"></div></div>
    <div class="grid g2"><div><label>Partner 2</label><input id="s_nb" value="${esc(s.name_b)}"></div><div><label>Monthly salary</label><input id="s_sb" inputmode="decimal" value="${num(s.salary_b) || ""}"></div></div>
    <div><label>Divide shared expenses</label>${pick("mode", [["salary", "By salary"], ["half", "50 / 50"], ["custom", "Custom %"]], s.split_mode)}
      <div id="s_cw" style="margin-top:8px" class="${s.split_mode === "custom" ? "" : "hidden"}"><label>${esc(s.name_a)} pays this % of shared expenses</label><input id="s_pa" inputmode="decimal" value="${num(s.split_a)}"></div>
      <div class="tiny muted" id="s_prev" style="margin-top:6px"></div></div>
    <div><button class="btn b-gold sm" id="s_al">🏦 Bank allocations ›</button></div>
    <div><label>Money-out categories (comma separated)</label><input id="s_co" value="${esc(s.cats_out.join(", "))}"></div>
    <div><label>Money-in categories (comma separated)</label><input id="s_ci" value="${esc(s.cats_in.join(", "))}"></div>
    <div class="al" style="margin:0"><label>Data file in OneDrive (same as the laptops)</label><input id="s_path" value="${esc(filePath())}"><div class="tiny muted" style="margin-top:6px">Only change this if Budgetr's folder on the laptop isn't OneDrive\\Budgetr.</div></div>
    ${DEMO ? "" : `<div><button class="btn b-line sm" id="s_out">Sign out of Microsoft</button></div>`}</div>
    <div class="mf"><button class="btn b-line" data-close>Cancel</button><button class="btn b-acc" data-save>Save</button></div>`,
  (box, close) => {
    wirePicks(box);
    const prev = () => { const md = picked(box, "mode"); $("#s_cw", box).classList.toggle("hidden", md !== "custom");
      const a = num($("#s_sa", box).value.replace(/,/g, "")), b = num($("#s_sb", box).value.replace(/,/g, ""));
      const p = md === "half" ? 50 : md === "custom" ? Math.min(100, Math.max(0, num($("#s_pa", box).value))) : a + b > 0 ? a / (a + b) * 100 : 50;
      $("#s_prev", box).textContent = `${$("#s_na", box).value || "Partner 1"} ${Math.round(p)}% • ${$("#s_nb", box).value || "Partner 2"} ${100 - Math.round(p)}% of every shared expense`; };
    box.addEventListener("input", prev); $('[data-pick="mode"]', box).addEventListener("change", prev); prev();
    $("#s_al", box).onclick = () => { close(); allocsDialog(); };
    const so = $("#s_out", box); if (so) so.onclick = () => { LS.del("tok"); LS.del("cache"); location.assign(`${AUTH}/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT)}`); };
    $("[data-save]", box).onclick = ev => busyBtn(ev.currentTarget, async () => {
      const n = v => { const t = String(v).replace(/[,₱\s]/g, ""); if (t === "") return 0; if (!/^\d*\.?\d+$/.test(t)) throw 0; return +t; };
      let sa, sb, pa; try { sa = n($("#s_sa", box).value); sb = n($("#s_sb", box).value); pa = n($("#s_pa", box).value); } catch (x) { return toast("Salaries and % must be numbers", "var(--out)"); }
      if (pa > 100) return toast("The % must be 0 to 100", "var(--out)");
      const co = $("#s_co", box).value.split(",").map(x => x.trim()).filter(Boolean), ci = $("#s_ci", box).value.split(",").map(x => x.trim()).filter(Boolean);
      if (!co.length || !ci.length) return toast("Keep at least one category of each", "var(--out)");
      const newPath = $("#s_path", box).value.trim().replace(/\\/g, "/").replace(/^\/+/, "");
      if (newPath && newPath !== filePath()) { LS.set("path", newPath); close(); return start(); }
      if (await change(dd => Object.assign(dd.settings, { name_a: $("#s_na", box).value.trim() || "Partner 1", name_b: $("#s_nb", box).value.trim() || "Partner 2",
        salary_a: sa, salary_b: sb, split_mode: picked(box, "mode") || "salary", split_a: pa, cats_out: co, cats_in: ci }), "✔ Settings saved", "var(--in)")) close();
    });
  });
}

/* ---------- clicks ---------- */
document.addEventListener("click", async ev => {
  if (modalOpen || !D) return;
  const t = ev.target.closest("[data-a],[data-view],[data-filter],[data-edit]"); if (!t) return;
  if (t.dataset.view) { st.view = t.dataset.view; return render(); }
  if (t.dataset.filter) { st.filter = t.dataset.filter; return render(); }
  if (t.dataset.edit) { const e = D.entries.find(x => x.id === t.dataset.edit); return e && entryDialog(e.kind, e); }
  switch (t.dataset.a) {
    case "in": entryDialog("in"); break; case "out": entryDialog("out"); break;
    case "payday": payday(); break; case "settings": settingsDialog(); break; case "allocs": allocsDialog(); break;
    case "prev": st.m--; if (st.m < 1) { st.m = 12; st.y--; } render(); break;
    case "next": st.m++; if (st.m > 12) { st.m = 1; st.y++; } render(); break;
    case "undo": { const e = st.undo; st.undo = null; await change(dd => { if (!dd.entries.some(x => x.id === e.id)) dd.entries.push(e); }, "↶ Restored", "var(--in)"); break; }
  }
});

/* ---------- start-up screens ---------- */
function screen(html) { $("#app").classList.add("hidden"); const sc = $("#screen"); sc.innerHTML = `<div class="card"><div style="text-align:center"><span class="logo" style="font-size:40px">Budgetr</span><span class="ver">v${VERSION}</span></div>${html}</div>`; sc.classList.remove("hidden"); return sc; }
function loginScreen(msg = "") {
  if (!window.BUDGETR_CLIENT_ID && !DEMO) return screen(`<p class="err-msg">Setup isn't finished: the Microsoft app ID hasn't been pasted into index.html yet (see SETUP.md, step 2).</p><p class="small"><a href="?demo" style="color:var(--accent)">Open the demo instead</a></p>`);
  const sc = screen(`<p class="muted" style="text-align:center">Your budget lives in your OneDrive, shared with the laptops. Sign in with the same Microsoft account.</p>
    ${msg ? `<p class="err-msg">${esc(msg)}</p>` : ""}<button class="btn b-acc w" id="go">Sign in with Microsoft</button>
    ${LS.get("cache") ? `<p style="text-align:center"><button class="link small" id="view">View last saved copy (read-only)</button></p>` : ""}`);
  $("#go", sc).onclick = () => signIn(false);
  const v = $("#view", sc); if (v) v.onclick = () => { D = normalize(LS.get("cache")); st.offline = true; banner("Read-only: sign in to add or change anything", "var(--warn)"); showApp(); };
}
function notFoundScreen() {
  const sc = screen(`<p class="err-msg">Couldn't find <b>${esc(filePath())}</b> in your OneDrive.</p>
    <p class="small muted">Open Budgetr on a laptop once (it creates the file), wait for OneDrive's green tick, then try again. If your Budgetr folder is somewhere else in OneDrive, type its path:</p>
    <input id="p" value="${esc(filePath())}"><div class="mf"><button class="btn b-line" id="new">Start a new file</button><button class="btn b-acc" id="retry">Try again</button></div>`);
  $("#retry", sc).onclick = () => { LS.set("path", $("#p", sc).value.trim().replace(/\\/g, "/").replace(/^\/+/, "")); start(); };
  $("#new", sc).onclick = async () => { if (!confirm(`Create a new, empty ${filePath()} in your OneDrive?`)) return;
    try { await Drive.write({ app: "Budgetr", rev: 1, settings: { ...DEFAULTS }, entries: [], saved_by: "Phone", saved_at: nowStamp() }, null); start(); }
    catch (e) { alert("Couldn't create it: " + (e.message || e)); } };
}
function showApp() { $("#screen").classList.add("hidden"); $("#app").classList.remove("hidden"); render(); }
async function refresh() {
  if (!D || modalOpen || st.offline || !navigator.onLine) return;
  try { const before = ETAG; await load(); if (ETAG !== before) { render(); toast("↻ Updated with the latest changes", "var(--a)"); } } catch (e) { }
}
async function start() {
  try {
    if (!DEMO) {
      const r = await finishRedirect();
      if (r === "silent-failed") return loginScreen();
      if (r && r !== "ok") return loginScreen(r);
      if (!LS.get("tok")) return loginScreen();
    } else if (!LS.get("demo_file")) {
      await Drive.write({ app: "Budgetr", rev: 0, settings: { ...DEFAULTS, salary_a: 50000, salary_b: 30000 }, entries: [] }, null);
    }
    st.offline = false; banner("");
    await load(); showApp();
  } catch (e) {
    console.error(e);
    if (e.needLogin) { if (LS.get("tok") === null && !sessionStorage.getItem("budgetr_tried_silent")) { sessionStorage.setItem("budgetr_tried_silent", "1"); return signIn(true); } return loginScreen(); }
    if (e.status === 404) return notFoundScreen();
    if (LS.get("cache")) { D = normalize(LS.get("cache")); st.offline = true; banner(navigator.onLine ? "Couldn't reach OneDrive - showing your last copy (read-only)" : "Offline - showing your last copy (read-only)", "var(--warn)"); return showApp(); }
    screen(`<p class="err-msg">Couldn't open your budget: ${esc(e.message || e)}</p><button class="btn b-acc w" onclick="location.reload()">Try again</button>`);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
addEventListener("online", () => { if (st.offline) start(); });
addEventListener("offline", () => banner("Offline - you can look, but saving waits until you're back online", "var(--warn)"));
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
